# Nginx Production Configuration for Multi-Worker Live Quiz Load Balancing
# Supports HTTP/1.1 WebSocket Upgrade proxying & IP-Hash Sticky Sessions for Tier-4 Infrastructure

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Allow large file uploads up to 25MB (for AI document parsing & media assets)
    client_max_body_size 25M;

    # Upstream cluster with ip_hash sticky sessions for WebSockets
    upstream quizz_backend_cluster {
        ip_hash;
        server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8003 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8004 max_fails=3 fail_timeout=10s;
    }

    # Port 80 Entrypoint
    server {
        listen 80;
        server_name _;

        # REST API & WebSocket Reverse Proxy
        location /api/ {
            proxy_pass http://quizz_backend_cluster;
            proxy_http_version 1.1;

            # WebSocket Header Upgrades
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Standard Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for persistent WebSocket connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Frontend Static / SPA Servicing
        location / {
            root /home/ubuntu/Quizz_App/frontend/dist;
            try_files $uri $uri/ /index.html;
        }
    }
}
